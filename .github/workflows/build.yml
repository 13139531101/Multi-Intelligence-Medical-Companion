name: Build & Push (5 images)

on:
  push:
    branches: [refactor/v2, main]
    tags: ["v*.*.*"]
  workflow_dispatch:

env:
  REGISTRY: crpi-zr8m4m7ism94623a.cn-hangzhou.personal.cr.aliyuncs.com/duozhiyiban
  IMAGE_PREFIX: a2aserver

jobs:
  build:
    name: Build & Push Images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true # 单个镜像失败不阻断其他
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: hostapi
            context: .
            dockerfile: frontend/hostAgentAPI/Dockerfile
            description: "Host API (FastAPI gateway)"
          - name: health_advisor
            context: backend/HealthAdvisor
            dockerfile: backend/HealthAdvisor/Dockerfile
            description: "Health Advisor MCP"
          - name: health_records
            context: backend/HealthRecordsManager
            dockerfile: backend/HealthRecordsManager/Dockerfile
            description: "Health Records MCP"
          - name: medication_reminder
            context: backend/MedicationReminder
            dockerfile: backend/MedicationReminder/Dockerfile
            description: "Medication Reminder MCP"
          - name: visit_summary
            context: backend/VisitSummaryGenerator
            dockerfile: backend/VisitSummaryGenerator/Dockerfile
            description: "Visit Summary MCP"
          - name: multiagent_front
            context: frontend/multiagent_front
            dockerfile: frontend/multiagent_front/Dockerfile
            description: "Multiagent Front (React AI UI)"

    steps:
      - uses: actions/checkout@v4

      - name: Set short SHA
        id: vars
        run: |
          echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Verify Dockerfile exists
        id: check
        run: |
          if [ -f "${{ matrix.target.dockerfile }}" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "::notice::Building ${{ matrix.target.name }} from ${{ matrix.target.dockerfile }}"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "::error::Dockerfile not found: ${{ matrix.target.dockerfile }}"
          fi

      - name: Login to Aliyun Container Registry
        if: steps.check.outputs.exists == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALIYUN_REGISTRY_USER }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
        continue-on-error: true

      - name: Set up Docker Buildx
        if: steps.check.outputs.exists == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build image
        if: steps.check.outputs.exists == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.target.context }}
          file: ${{ matrix.target.dockerfile }}
          push: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/refactor/v2' || startsWith(github.ref, 'refs/tags/v')) }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.target.name }}:${{ steps.vars.outputs.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.target.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
        continue-on-error: true

      - name: Build summary
        if: always()
        run: |
          echo "### ${{ matrix.target.name }}" >> $GITHUB_STEP_SUMMARY
          echo "${{ matrix.target.description }}" >> $GITHUB_STEP_SUMMARY
          echo "Dockerfile: \`${{ matrix.target.dockerfile }}\`" >> $GITHUB_STEP_SUMMARY
          echo "SHA: \`${{ steps.vars.outputs.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
