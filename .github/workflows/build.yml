name: Build & Push (5 images)

on:
  push:
    branches: [refactor/v2, main]
    tags: ['v*.*.*']
  workflow_dispatch:

env:
  REGISTRY: crpi-zr8m4m7ism94623a.cn-hangzhou.personal.cr.aliyuncs.com/duozhiyiban
  IMAGE_PREFIX: a2aserver

jobs:
  build:
    name: Build & Push Images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: hostapi
            context: frontend/hostAgentAPI
            dockerfile: frontend/hostAgentAPI/Dockerfile
          - name: health_advisor
            context: backend/agents/health_advisor
            dockerfile: backend/agents/health_advisor/Dockerfile
          - name: health_records
            context: backend/agents/health_records
            dockerfile: backend/agents/health_records/Dockerfile
          - name: medication_reminder
            context: backend/agents/medication_reminder
            dockerfile: backend/agents/medication_reminder/Dockerfile
          - name: visit_summary
            context: backend/agents/visit_summary
            dockerfile: backend/agents/visit_summary/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - name: Set short SHA
        id: vars
        run: |
          echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Login to Aliyun Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALIYUN_REGISTRY_USER }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
        continue-on-error: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check if Dockerfile exists
        id: check
        run: |
          if [ -f "${{ matrix.target.dockerfile }}" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "::warning::Dockerfile not found: ${{ matrix.target.dockerfile }}, using generic"
          fi

      - name: Build image
        if: steps.check.outputs.exists == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.target.context }}
          file: ${{ matrix.target.dockerfile }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/refactor/v2' || startsWith(github.ref, 'refs/tags/v') }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.target.name }}:${{ steps.vars.outputs.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.target.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build summary
        if: always()
        run: |
          echo "Built: ${{ matrix.target.name }} (sha=${{ steps.vars.outputs.sha }})"
