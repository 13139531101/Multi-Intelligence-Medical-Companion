name: Lint (Ruff + Black + Mypy)

on:
  push:
    branches: [refactor/v2, main, develop]
  pull_request:
    branches: [refactor/v2, main, develop]

jobs:
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install ruff black mypy

      - name: Ruff (linter)
        run: |
          ruff check backend/A2AServer/src/A2AServer/v2/ \
                 frontend/hostAgentAPI/ \
                 scripts/ \
                 --output-format=github
        continue-on-error: true  # 警告级别，不阻断

      - name: Black (format check)
        run: |
          black --check --diff backend/A2AServer/src/A2AServer/v2/ \
                            frontend/hostAgentAPI/ \
                            scripts/ || true
        continue-on-error: true

      - name: Mypy (type check, 关键文件)
        run: |
          mypy backend/A2AServer/src/A2AServer/v2/oauth2.py \
                backend/A2AServer/src/A2AServer/v2/rag.py \
                backend/A2AServer/src/A2AServer/v2/write_audit.py \
                --ignore-missing-imports \
                --no-strict-optional || true
        continue-on-error: true
