# Promtail 配置（阶段48-ops）
# 从所有容器 stdout/stderr + 本地日志文件抓取，发往 Loki

server:
  http_listen_port: 9080
  grpc_listen_port: 0

clients:
  - url: http://loki:3100/loki/api/v1/push

positions:
  filename: /tmp/positions.yaml

scrape_configs:
  # 1. 从 Docker 容器日志抓取（所有服务）
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Only include containers from the a2aserver project
      - source_labels: [__meta_docker_container_label_com_docker_compose_project]
        regex: 'a2aserver'
        action: keep
      - source_labels: [__meta_docker_container_name]
        regex: '/(.*)'
        target_label: container
      - source_labels: [__meta_docker_container_log_stream]
        regex: 'stdout|stderr'
        action: keep
      - action: labelmap
        regex: '__meta_docker_container_label_(.*)'
        replacement: '${1}'
      - action: labeldrop
        regex: 'com_docker_compose_.*'
    pipeline_stages:
      - json:
          expressions:
            level: level
            logger: logger
            message: message
            agent: agent
            request_id: request_id
            user_id: user_id
      - labels:
          level:
          agent:
          container:

  # 2. 从 hostapi 日志文件抓取
  - job_name: hostapi-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: hostapi
          service: hostapi
          __path__: /logs/hostapi*.log
    pipeline_stages:
      - json:
          expressions:
            level: levelname
            message: message
            agent: agent
      - labels:
          level:
          agent:

  # 3. 从 backend 日志目录抓取
  - job_name: backend-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: backend
          __path__: /logs/**/*.log
    pipeline_stages:
      - json:
          expressions:
            level: levelname
            message: message
            agent: agent
      - labels:
          level:
          agent:
