# ============================================================
# PHA v2 K8s Manifest - Redis (Deployment + PVC)
# ============================================================
# 学习点：
# - Redis 是内存数据库，PVC 用于 AOF 持久化
# - Deployment 即可（Redis 主从需用 Sentinel / Cluster，超出本教程）
apiVersion: v1
kind: Service
metadata:
  name: pha-redis
  namespace: pha
  labels:
    app: pha-redis
spec:
  type: ClusterIP
  selector:
    app: pha-redis
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pha-redis-data
  namespace: pha
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: standard
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pha-redis
  namespace: pha
  labels:
    app: pha-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pha-redis
  template:
    metadata:
      labels:
        app: pha-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
              name: redis
          command: ["redis-server", "--appendonly", "yes"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1
              memory: 1Gi
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pha-redis-data
