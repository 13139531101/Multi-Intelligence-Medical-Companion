# ============================================================
# PHA v2 K8s Manifest - Namespace
# ============================================================
# 学习点：
# - namespace 是 K8s 资源隔离单位（多租户 / 多环境）
# - 默认 limit range 防止容器无限制用资源
apiVersion: v1
kind: Namespace
metadata:
  name: pha
  labels:
    name: pha
    app.kubernetes.io/part-of: pha-v2
    app.kubernetes.io/managed-by: kubectl
---
apiVersion: v1
kind: LimitRange
metadata:
  name: pha-default-limits
  namespace: pha
spec:
  limits:
    - type: Container
      default:
        cpu: "2"
        memory: "2Gi"
        ephemeral-storage: "10Gi"
      defaultRequest:
        cpu: "200m"
        memory: "256Mi"
        ephemeral-storage: "100Mi"
      max:
        cpu: "4"
        memory: "8Gi"
