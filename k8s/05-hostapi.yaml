# ============================================================
# PHA v2 K8s Manifest - hostapi (核心 API + ServiceAccount)
# ============================================================
# 学习点：
# - ServiceAccount: Pod 身份，用于 RBAC
# - ClusterRole + ClusterRoleBinding: K8s API 权限
# - 这里不用，给 Pod 最小权限即可
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pha-hostapi
  namespace: pha
---
apiVersion: v1
kind: Service
metadata:
  name: pha-hostapi
  namespace: pha
  labels:
    app: pha-hostapi
spec:
  type: ClusterIP
  selector:
    app: pha-hostapi
  ports:
    - port: 13002
      targetPort: 13002
      name: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pha-hostapi
  namespace: pha
  labels:
    app: pha-hostapi
spec:
  replicas: 2  # 多副本水平扩展
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: pha-hostapi
  template:
    metadata:
      labels:
        app: pha-hostapi
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "13002"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: pha-hostapi
      containers:
        - name: hostapi
          image: crpi-zr8m4m7ism94623a.cn-hangzhou.personal.cr.aliyuncs.com/duozhiyiban/a2aserver-hostapi:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 13002
              name: http
          env:
            - { name: HOST_API_PORT, value: "13002" }
            - { name: HOST_API_BIND, value: "0.0.0.0" }
            - { name: PYTHONPATH, value: "/app:/app/backend" }
            - { name: BACKEND_DIR, value: "/app/backend" }
            - { name: DB_HOST, value: "pha-postgres" }
            - { name: DB_PORT, value: "5432" }
          envFrom:
            - configMapRef: { name: pha-config }
            - secretRef:  { name: pha-secrets }
          resources:
            requests: { cpu: 300m, memory: 512Mi }
            limits:   { cpu: 2, memory: 2Gi }
          livenessProbe:
            httpGet: { path: /health, port: 13002 }
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /health/deep, port: 13002 }
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                # 优雅停止：等待 in-flight 请求完成
                command: ["sh", "-c", "sleep 5"]
          securityContext:
            runAsNonRoot: false  # 镜像默认 root，简化
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
