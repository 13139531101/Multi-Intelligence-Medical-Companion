# ============================================================
# PHA v2 K8s Manifest - Secret + ConfigMap
# ============================================================
# 学习点：
# - Secret: 存敏感信息（API key / DB 密码），base64 编码
# - ConfigMap: 存非敏感配置（端口 / 限流参数）
# - 生产环境应该用 External Secrets Operator / Sealed Secrets / Vault
---
apiVersion: v1
kind: Secret
metadata:
  name: pha-secrets
  namespace: pha
  labels:
    app.kubernetes.io/part-of: pha-v2
type: Opaque
stringData:
  # ⚠️ 占位符 - 生产必须用真实密钥 + 用 sealed-secret / External Secrets / Vault
  # 命令：kubectl create secret generic pha-secrets --from-literal=KEY=VALUE -n pha --dry-run=client -o yaml | kubectl apply -f -
  POSTGRES_PASSWORD: "REPLACE_ME_postgres_password"
  JWT_SECRET_KEY: "REPLACE_ME_jwt_secret_key"
  ADMIN_TOKEN: "REPLACE_ME_admin_token"
  DEEPSEEK_API_KEY: "REPLACE_ME_deepseek_api_key"
  DASHSCOPE_API_KEY: "REPLACE_ME_dashscope_api_key"
  ALIYUN_ACCESS_KEY_ID: "REPLACE_ME_aliyun_ak_id"
  ALIYUN_ACCESS_KEY_SECRET: "REPLACE_ME_aliyun_ak_secret"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pha-config
  namespace: pha
  labels:
    app.kubernetes.io/part-of: pha-v2
data:
  # 业务配置
  POSTGRES_USER: "pha"
  POSTGRES_DB: "personal_health_assistant"
  # hostapi
  HOST_API_PORT: "13002"
  HOST_API_BIND: "0.0.0.0"
  # v2 性能参数
  PHA_LLM_QPS: "30"
  PHA_USER_RPM: "60"
  PHA_AGENT_RPM: "60"
  PHA_RATE_LIMIT_WINDOW: "60"
  PHA_RATE_LIMIT: "true"
  PHA_TOOL_CACHE_TTL: "60"
  PHA_TOOL_CACHE_MAX: "1000"
  PHA_CONCURRENT_TOOLS: "true"
  PHA_MAX_CONCURRENCY: "5"
  PHA_WARMUP_ON_STARTUP: "true"
  # LLM / Embedding
  PHA_LLM_MODEL: "deepseek-chat"
  EMBEDDING_PROVIDER: "dashscope"
  EMBEDDING_MODEL: "text-embedding-v4"
  EMBEDDING_DIM: "384"
  EMBEDDING_API_BASE: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  USE_LLM_SUMMARY: "true"
  USE_LLM_INDICATOR_AUDIT: "true"
  # OCR
  OCR_PROVIDER: "aliyun"
  ALIYUN_OCR_VERSION: "2021-07-07"
  ALIYUN_REGION_ID: "cn-shanghai"
  ALIYUN_OCR_ENDPOINT: "ocr-api.cn-shanghai.aliyuncs.com"
  ALIYUN_OCR_TYPE: "general"
  # Misc
  A2A_CURRENT_USER_ID: "111"
  REDIS_URL: "redis://pha-redis:6379/0"
  JWT_ALGORITHM: "HS256"
  PYTHONUNBUFFERED: "1"
  TZ: "Asia/Shanghai"
