[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "A2AServer"
version = "1.0.0"
description = "A2A and MCP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp",
    "requests",
    "dotenv",
    "tenacity",
    "mcp<2.0",  # 阶段48-fix: 2.x 移除了 mcp.server.fastmcp, 所有 *_tool.py 会 import 失败
    "zhipuai",
    "cachetools",
    "asyncclick",
    "lmstudio",
    "openai",
    "google-genai>=1.10.0",
    "duckduckgo-search>=5.0",  # 阶段48-CRAG: web search provider
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
