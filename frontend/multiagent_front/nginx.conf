# multiagent_front nginx 配置
#
# 两个关键点（此前硬编码在 Dockerfile 的 RUN echo 里，导致两个生产故障）：
#
# 1. 动态 DNS 解析
#    原配置 `proxy_pass http://hostapi:13002/...` 会让 nginx 在 **启动时** 解析
#    upstream 主机名；hostapi 未就绪时 nginx 直接 `[emerg] host not found` 退出，
#    配合 restart 策略形成崩溃循环。
#    改用 `resolver`（Docker 内嵌 DNS 127.0.0.11）+ 变量形式的 proxy_pass，
#    解析推迟到请求时进行 → hostapi 没起来只会返回 502，恢复后自动自愈。
#
# 2. SSE 透传
#    /api/copilotkit 是 AG-UI 的 SSE 长连接。nginx 默认 proxy_buffering on +
#    proxy_read_timeout 60s，会把流式响应积压、并在长工具调用时直接掐断。
#    下面显式关闭缓冲并放宽超时。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker 内嵌 DNS；valid=10s 让上游 IP 变化能在 10s 内被重新解析
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 前端静态资源（SPA history fallback）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- hostapi 反向代理 ----
    # 用变量 $upstream_hostapi 推迟解析；$request_uri 保留完整原始 URI + query
    location /api/ {
        set $upstream_hostapi "http://hostapi:13002";
        proxy_pass $upstream_hostapi$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 必需：不缓冲、长超时、禁用 chunked 重编码
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;
    }

    location /v2/ {
        set $upstream_hostapi "http://hostapi:13002";
        proxy_pass $upstream_hostapi$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;
    }

    location /auth/ {
        set $upstream_hostapi "http://hostapi:13002";
        proxy_pass $upstream_hostapi$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /health、/copilotkit、/smart_chat 等无前缀路由
    location ~ ^/(health|copilotkit|smart_chat) {
        set $upstream_hostapi "http://hostapi:13002";
        proxy_pass $upstream_hostapi$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # copilotkit 走 SSE
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;
    }
}
