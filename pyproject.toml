# =============================================================================
# Multi-Intelligence Medical Companion — v2 依赖清单
# 重构方案见 docs/Chinese/REFACTOR_PLAN_v2.md
# 阶段1：基础设施升级（零业务影响）
# 推荐包管理工具：uv  (https://docs.astral.sh/uv/)
# =============================================================================

[project]
name = "pha-multi-agent"
version = "2.0.0"
description = "Multi-Intelligence Medical Companion (Refactor v2)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [
    { name = "Architecture Team" },
]

# -----------------------------------------------------------------------------
# 核心依赖
# -----------------------------------------------------------------------------
dependencies = [
    # ===== AI 框架层 (LangChain 1.x / LangGraph 1.x) =====
    "langchain>=1.2.10,<2.0",
    "langgraph>=1.0.2,<1.1",
    "langgraph-checkpoint-postgres>=3.0.2,<4.0",
    "langchain-postgres>=0.0.15",
    "langchain-openai>=0.3.0",
    "langchain-mcp-adapters>=0.1.0",
    "a2a-sdk>=0.3.0",
    "langsmith>=0.2.0",

    # ===== Web / 数据 =====
    "fastapi>=0.128.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "psycopg[binary,pool]>=3.2.3",
    "sqlalchemy[asyncio]>=2.0.36",
    "redis>=5.2.0",
    "httpx>=0.28.1",
    "httpx-sse>=0.4.0",
    "orjson>=3.10.0",

    # ===== 鉴权 / 观测 =====
    "authlib>=1.3.2",
    "pyjwt>=2.9.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
    "langfuse>=2.0.0",

    # ===== 业务侧（保留）=====
    "python-multipart>=0.0.6",
    "python-dotenv>=1.0.0",
    "pandas>=2.2.0",
    "numpy>=2.0.0",
    "pypdf>=5.0.0",
    "python-dateutil>=2.9.0",
    "Pillow>=11.0.0",
    "cryptography>=43.0.0",
    "loguru>=0.7.2",
    "psutil>=6.1.0",
    "schedule>=1.2.2",
    "typing-extensions>=4.12.0",
    "tenacity>=9.0.0",
    "cachetools>=5.5.0",
    "deprecated>=1.2.14",
    "email-validator>=2.2.0",
    "SQLAlchemy>=2.0.36",
    "alibabacloud-ocr20191230>=3.1.0",
    "alibabacloud-ocr-api20210707>=3.1.3",
    "alibabacloud-tea-openapi>=0.3.13",
    "alibabacloud-tea-util>=0.3.13",
]

[project.optional-dependencies]
# ---- 开发与测试 ----
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "black>=24.10.0",
    "isort>=5.13.0",
    "pre-commit>=4.0.0",
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "ipython>=8.27.0",
]

# ---- A2A 协议（暴露子 Agent 为 A2A Server）----
a2a = [
    "a2a-sdk[http-server]>=0.3.0",
    "a2a-sdk[grpc]>=0.3.0",
]

# ---- 长任务编排（阶段4）----
temporal = [
    "temporalio>=1.7.0",
]

# ---- 高级可观测（生产）----
observability = [
    "opentelemetry-exporter-otlp>=1.27.0",
    "prometheus-client>=0.21.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
]

[project.urls]
Documentation = "https://github.com/13139531101/Multi-Intelligence-Medical-Companion"
Repository = "https://github.com/13139531101/Multi-Intelligence-Medical-Companion"
RefactorPlan = "docs/Chinese/REFACTOR_PLAN_v2.md"

# -----------------------------------------------------------------------------
# 工具配置
# -----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/node_modules", "**/__pycache__", "**/.git", "**/venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_return_any = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers"

# -----------------------------------------------------------------------------
# uv 专用配置（可选，加速安装）
# -----------------------------------------------------------------------------
[tool.uv]
dev-dependencies = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[tool.uv.sources]
# 如需内网 PyPI 镜像，在此配置 index-url
# pypi = { index = "https://pypi.tuna.tsinghua.edu.cn/simple" }
