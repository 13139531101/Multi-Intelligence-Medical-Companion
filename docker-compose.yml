services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: pha-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-pha}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-pha_pass}
      - POSTGRES_DB=${POSTGRES_DB:-personal_health_assistant}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-pha} -d ${POSTGRES_DB:-personal_health_assistant}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pha-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  health_advisor:
    build:
      context: backend
      dockerfile: HealthAdvisor/Dockerfile
    environment:
      - PORT=10011
      - HOST=0.0.0.0
      - PYTHONPATH=/app
      - DB_NAME=${POSTGRES_DB:-personal_health_assistant}
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${DB_USER:-pha}
      - DB_PASSWORD=${DB_PASSWORD:-pha_pass}
      - DATABASE_URL=${DATABASE_URL:-postgresql://pha:pha_pass@postgres:5432/personal_health_assistant}
      - MEMORY_DATABASE_URL=${MEMORY_DATABASE_URL:-postgresql://pha:pha_pass@postgres:5432/personal_health_assistant}
      - A2A_CURRENT_USER_ID=${A2A_CURRENT_USER_ID:-111}
      - SPARK_APP_ID=${SPARK_APP_ID:-}
      - SPARK_API_KEY=${SPARK_API_KEY:-}
      - SPARK_API_SECRET=${SPARK_API_SECRET:-}
      - SPARK_API_URL=${SPARK_API_URL:-}
      - SPARK_API_DOMAIN=${SPARK_API_DOMAIN:-}
      - SPARK_API_PASSWORD=${SPARK_API_PASSWORD:-}
      - SPARK_HTTP_URL=${SPARK_HTTP_URL:-}
      - SPARK_MODEL=${SPARK_MODEL:-}
      - SPARK_TIMEOUT_SECONDS=${SPARK_TIMEOUT_SECONDS:-25}
    ports:
      - "10011:10011"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request, sys; urllib.request.urlopen(''http://localhost:10011/.well-known/agent.json'')" || exit 1',
        ]
      interval: 5s
      timeout: 3s
      retries: 12

  medication_reminder:
    build:
      context: backend
      dockerfile: MedicationReminder/Dockerfile
    environment:
      - PORT=10012
      - HOST=0.0.0.0
      - PYTHONPATH=/app
      - DATABASE_URL=${DATABASE_URL:-postgresql://pha:pha_pass@postgres:5432/personal_health_assistant}
      - PG_DSN=${DATABASE_URL:-postgresql://pha:pha_pass@postgres:5432/personal_health_assistant}
      - A2A_CURRENT_USER_ID=${A2A_CURRENT_USER_ID:-111}
      - MEMORY_DATABASE_URL=${MEMORY_DATABASE_URL:-postgresql://pha:pha_pass@postgres:5432/personal_health_assistant}
    ports:
      - "10012:10012"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request, sys; urllib.request.urlopen(''http://localhost:10012/.well-known/agent.json'')" || exit 1',
        ]
      interval: 5s
      timeout: 3s
      retries: 12

  visit_summary:
    build:
      context: backend
      dockerfile: VisitSummaryGenerator/Dockerfile
    environment:
      - PORT=10013
      - HOST=0.0.0.0
      - PYTHONPATH=/app
      - DATABASE_URL=${DATABASE_URL:-postgresql://pha:pha_pass@postgres:5432/personal_health_assistant}
      - DB_NAME=${POSTGRES_DB:-personal_health_assistant}
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${DB_USER:-pha}
      - DB_PASSWORD=${DB_PASSWORD:-pha_pass}
      - MEMORY_DATABASE_URL=${MEMORY_DATABASE_URL:-postgresql://pha:pha_pass@postgres:5432/personal_health_assistant}
      - A2A_CURRENT_USER_ID=${A2A_CURRENT_USER_ID:-111}
    ports:
      - "10013:10013"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request, sys; urllib.request.urlopen(''http://localhost:10013/.well-known/agent.json'')" || exit 1',
        ]
      interval: 5s
      timeout: 3s
      retries: 12

  health_records:
    build:
      context: backend
      dockerfile: HealthRecordsManager/Dockerfile
    environment:
      - PORT=10010
      - HOST=0.0.0.0
      - PYTHONPATH=/app
      - DB_NAME=${POSTGRES_DB:-personal_health_assistant}
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${DB_USER:-pha}
      - DB_PASSWORD=${DB_PASSWORD:-pha_pass}
      - MEMORY_DATABASE_URL=${MEMORY_DATABASE_URL:-postgresql://pha:pha_pass@postgres:5432/personal_health_assistant}
      - A2A_CURRENT_USER_ID=${A2A_CURRENT_USER_ID:-111}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-secret}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      # OCR 配置：通过项目根环境变量注入
      - OCR_PROVIDER=${OCR_PROVIDER:-local}
      - ALIYUN_OCR_VERSION=${ALIYUN_OCR_VERSION}
      - ALIYUN_ACCESS_KEY_ID=${ALIYUN_ACCESS_KEY_ID}
      - ALIYUN_ACCESS_KEY_SECRET=${ALIYUN_ACCESS_KEY_SECRET}
      - ALIYUN_REGION_ID=${ALIYUN_REGION_ID}
      - ALIYUN_OCR_ENDPOINT=${ALIYUN_OCR_ENDPOINT}
      - ALIYUN_OCR_TYPE=${ALIYUN_OCR_TYPE}
      - USE_LLM_SUMMARY=${USE_LLM_SUMMARY:-false}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - HEALTH_RECORDS_LLM_PROVIDER=${HEALTH_RECORDS_LLM_PROVIDER:-}
      - HEALTH_RECORDS_LLM_MODEL=${HEALTH_RECORDS_LLM_MODEL:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    ports:
      - "10010:10010"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request, sys; urllib.request.urlopen(''http://localhost:10010/.well-known/agent.json'')" || exit 1',
        ]
      interval: 5s
      timeout: 3s
      retries: 12

  admin_backend:
    build:
      context: backend
      dockerfile: Dockerfile.admin
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - PYTHONPATH=/app
      # 复用已有的数据库配置
      - DATABASE_URL=${DATABASE_URL:-postgresql://pha:pha_pass@postgres:5432/personal_health_assistant}
      - DB_NAME=${POSTGRES_DB:-personal_health_assistant}
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${DB_USER:-pha}
      - DB_PASSWORD=${DB_PASSWORD:-pha_pass}
      - MEMORY_DATABASE_URL=${MEMORY_DATABASE_URL:-postgresql://pha:pha_pass@postgres:5432/personal_health_assistant}
      - A2A_CURRENT_USER_ID=${A2A_CURRENT_USER_ID:-111}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - ADMIN_TOKEN=${ADMIN_TOKEN:?ADMIN_TOKEN is required}
      # OCR & LLM 配置
      - OCR_PROVIDER=${OCR_PROVIDER:-local}
      - ALIYUN_OCR_VERSION=${ALIYUN_OCR_VERSION}
      - ALIYUN_ACCESS_KEY_ID=${ALIYUN_ACCESS_KEY_ID}
      - ALIYUN_ACCESS_KEY_SECRET=${ALIYUN_ACCESS_KEY_SECRET}
      - ALIYUN_REGION_ID=${ALIYUN_REGION_ID}
      - ALIYUN_OCR_ENDPOINT=${ALIYUN_OCR_ENDPOINT}
      - ALIYUN_OCR_TYPE=${ALIYUN_OCR_TYPE}
      - USE_LLM_SUMMARY=${USE_LLM_SUMMARY:-false}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - EMBEDDING_TIMEOUT_SECONDS=${EMBEDDING_TIMEOUT_SECONDS:-60}
      - A2A_MEDICAL_KB_MAX_UPLOAD_MB=${A2A_MEDICAL_KB_MAX_UPLOAD_MB:-50}
    ports:
      - "${ADMIN_BACKEND_BIND_IP:-127.0.0.1}:${ADMIN_BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      - postgres

  admin_frontend:
    build:
      context: frontend/admin-dashboard
      dockerfile: Dockerfile
    ports:
      - "${ADMIN_FRONTEND_BIND_IP:-127.0.0.1}:${ADMIN_FRONTEND_PORT:-3002}:80"
    depends_on:
      - admin_backend

  hostapi:
    build:
      context: .
      dockerfile: frontend/hostAgentAPI/Dockerfile
    environment:
      - HOST_API_PORT=13002
      - HOST_API_BIND=0.0.0.0
      - PYTHONPATH=/app
      - BACKEND_DIR=/app/backend
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - USE_LLM_SUMMARY=${USE_LLM_SUMMARY:-false}
      - USE_LLM_INDICATOR_AUDIT=${USE_LLM_INDICATOR_AUDIT:-true}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - WECHAT_APP_ID=${WECHAT_APP_ID:-}
      - WECHAT_APP_SECRET=${WECHAT_APP_SECRET:-}
      - WECHAT_TEMPLATE_TASK_COMPLETE=${WECHAT_TEMPLATE_TASK_COMPLETE:-}
      - WECHAT_TEMPLATE_HEALTH_ALERT=${WECHAT_TEMPLATE_HEALTH_ALERT:-}
      - WECHAT_TEMPLATE_MEDICATION_REMINDER=${WECHAT_TEMPLATE_MEDICATION_REMINDER:-}
      # 为 Host API 注入数据库 DSN，供提醒工具等使用
      - DATABASE_URL=${DATABASE_URL:-postgresql://pha:pha_pass@postgres:5432/personal_health_assistant}
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${DB_USER:-pha}
      - DB_PASSWORD=${DB_PASSWORD:-pha_pass}
      - MEMORY_DATABASE_URL=${MEMORY_DATABASE_URL:-postgresql://pha:pha_pass@postgres:5432/personal_health_assistant}
      - A2A_CURRENT_USER_ID=${A2A_CURRENT_USER_ID:-111}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-secret}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      # 为 Host API 注入 OCR 相关环境变量，确保内嵌健康档案 OCR 正常工作
      - OCR_PROVIDER=${OCR_PROVIDER:-local}
      - ALIYUN_OCR_VERSION=${ALIYUN_OCR_VERSION}
      - ALIYUN_ACCESS_KEY_ID=${ALIYUN_ACCESS_KEY_ID}
      - ALIYUN_ACCESS_KEY_SECRET=${ALIYUN_ACCESS_KEY_SECRET}
      - ALIYUN_REGION_ID=${ALIYUN_REGION_ID}
      - ALIYUN_OCR_ENDPOINT=${ALIYUN_OCR_ENDPOINT}
      - ALIYUN_OCR_TYPE=${ALIYUN_OCR_TYPE}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
    ports:
      - "13002:13002"
    mem_limit: 1g
    volumes:
      - ./backend:/app/backend
      - hostapi_uploads:/app/uploads
    depends_on:
      redis:
        condition: service_healthy
      health_advisor:
        condition: service_healthy
      medication_reminder:
        condition: service_healthy
      visit_summary:
        condition: service_healthy
      health_records:
        condition: service_healthy

volumes:
  postgres_data:
  hostapi_uploads:
  redis_data:
