services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: pha-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pha -d personal_health_assistant"]
      interval: 10s
      timeout: 5s
      retries: 5

  health_advisor:
    build:
      context: backend
      dockerfile: HealthAdvisor/Dockerfile
    environment:
      - PORT=10011
      - HOST=0.0.0.0
      - PYTHONPATH=/app
      - DATABASE_URL=${DATABASE_URL}
    ports:
      - "10011:10011"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request, sys; urllib.request.urlopen('http://localhost:10011/.well-known/agent.json')\" || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12

  medication_reminder:
    build:
      context: backend
      dockerfile: MedicationReminder/Dockerfile
    environment:
      - PORT=10012
      - HOST=0.0.0.0
      - PYTHONPATH=/app
      - DATABASE_URL=${DATABASE_URL}
      # 显式为提醒工具设置 PostgreSQL 连接（容器内主机名为 postgres）
      - PG_DSN=postgresql://pha:pha_pass@postgres:5432/personal_health_assistant
    ports:
      - "10012:10012"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request, sys; urllib.request.urlopen('http://localhost:10012/.well-known/agent.json')\" || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12

  visit_summary:
    build:
      context: backend
      dockerfile: VisitSummaryGenerator/Dockerfile
    environment:
      - PORT=10013
      - HOST=0.0.0.0
      - PYTHONPATH=/app
      - MEMORY_DATABASE_URL=${MEMORY_DATABASE_URL}
    ports:
      - "10013:10013"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request, sys; urllib.request.urlopen('http://localhost:10013/.well-known/agent.json')\" || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12

  health_records:
    build:
      context: backend
      dockerfile: HealthRecordsManager/Dockerfile
    environment:
      - PORT=10010
      - HOST=0.0.0.0
      - PYTHONPATH=/app
      - DB_NAME=${POSTGRES_DB}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
    ports:
      - "10010:10010"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request, sys; urllib.request.urlopen('http://localhost:10010/.well-known/agent.json')\" || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12

  hostapi:
    build:
      context: .
      dockerfile: frontend/hostAgentAPI/Dockerfile
    environment:
      - HOST_API_PORT=13002
      - HOST_API_BIND=0.0.0.0
      - PYTHONPATH=/app/backend:/app
      # 为 Host API 注入数据库 DSN，供提醒工具等使用
      - DATABASE_URL=${DATABASE_URL}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
    ports:
      - "13002:13002"
    volumes:
      - ./backend:/app/backend
    depends_on:
      health_advisor:
        condition: service_healthy
      medication_reminder:
        condition: service_healthy
      visit_summary:
        condition: service_healthy
      health_records:
        condition: service_healthy

  multiagent_front:
    build:
      context: frontend/multiagent_front
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - hostapi

volumes:
  postgres_data: